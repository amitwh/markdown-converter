<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowchart Generator - MarkdownConverter</title>
    <!--
      v4.9.6 — Standalone Flowchart Generator window.
      Stylesheets are src/-relative (mirrors src/index.html). NO ../ escape —
      the standalone BrowserWindow's document base is src/, so a ../fonts.css
      would resolve outside src/ and fail to load.

      v4.11.0 — Added a node-list panel (#fc-nodelist) below the canvas
      that exposes every mutation via buttons and form controls. The
      canvas itself is purely visual now (the v4.10.0 floating selection
      toolbar that fired on click hit-testing was unreliable in the
      user's Electron runtime). Removed #fc-selection-toolbar.

      v4.12.0 — Reorganised #fc-nodelist so the connect form is the
      second section (right after Add Node) instead of being buried below
      the node/edge lists; added per-node color picker; added
      "Save to File" button next to "Insert at Cursor".
    -->
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles-modern.css" />
    <link rel="stylesheet" href="styles-concreteinfo.css" />
    <link rel="stylesheet" href="styles-sidebar.css" />
    <link rel="stylesheet" href="styles-zen.css" />
    <link rel="stylesheet" href="styles-welcome.css" />
    <link rel="stylesheet" href="katex.min.css" />
    <style>
      :root {
        --fc-bg: #fafafa;
        --fc-text: #1f2328;
        --fc-border: #d0d7de;
        --fc-accent: #e5461f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--fc-bg);
        color: var(--fc-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .fc-header {
        background: linear-gradient(135deg, #464646 0%, #0d0b09 100%);
        padding: 12px 20px;
        border-bottom: 3px solid var(--fc-accent);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .fc-header h1 {
        color: #fff;
        font-size: 1.05rem;
        font-weight: 600;
      }
      .fc-hint {
        color: #9a9696;
        font-size: 0.75rem;
      }
      .fc-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--fc-border);
        background: #fff;
      }
      .fc-btn {
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid var(--fc-border);
        background: #fff;
        color: var(--fc-text);
      }
      .fc-btn:hover {
        border-color: var(--fc-accent);
      }
      .fc-btn.primary {
        background: var(--fc-accent);
        color: #fff;
        border-color: var(--fc-accent);
      }
      .fc-btn.primary:hover {
        background: #c93a18;
      }
      .fc-status {
        margin-left: auto;
        font-size: 0.75rem;
        color: #6e7681;
      }
      /* v4.12.0 — the status line moved inside #fc-nodelist (no longer a
       * flex toolbar child), so `margin-left: auto` is a no-op there. Reset
       * it explicitly so the status sits flush-left below the toolbar row. */
      .fc-nodelist .fc-status {
        margin-left: 0;
        display: block;
        min-height: 1em;
      }
      .fc-split {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      /* v4.11.0 — left column holds both the canvas and the node-list panel.
       * Flex-column so the canvas expands to fill remaining space and the
       * nodelist sits below with a fixed max-height. */
      .fc-left {
        flex: 7;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .fc-canvas-host {
        flex: 1;
        min-width: 0;
        min-height: 200px;
        position: relative;
        background: #fafafa;
        border-right: 1px solid var(--fc-border);
      }
      .fc-canvas-host svg.flowchart-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: default;
      }
      .fc-preview-host {
        flex: 3;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #fafafa;
      }
      .fc-preview-source {
        flex: 1;
        min-height: 120px;
        margin: 0;
        padding: 12px;
        font-family: var(--mono-font, 'JetBrains Mono', monospace);
        font-size: 12px;
        overflow: auto;
        white-space: pre;
        border-bottom: 1px solid var(--fc-border);
        background: #fff;
        color: var(--fc-text);
      }
      .fc-preview-render {
        flex: 1;
        min-height: 120px;
        padding: 12px;
        overflow: auto;
        background: #fff;
      }
      /* v4.9.6 — forced light surfaces inside the standalone window.
       * Diverges from body theme to guarantee readability, mirroring the
       * v4.9.5 fix in src/styles-sidebar.css for the (now-legacy) sidebar. */
      .fc-canvas-host,
      .fc-preview-host {
        background: #fafafa !important;
        color: #1f2328 !important;
      }
      .flowchart-node rect,
      .flowchart-node polygon {
        fill: #ffffff !important;
        stroke: #1f2328 !important;
        stroke-width: 1.25;
      }
      .flowchart-node text {
        fill: #1f2328 !important;
      }
      .flowchart-edge {
        stroke: #1f2328 !important;
      }
      /* v4.10.0 — preview-render info card explaining the layout */
      .fc-preview-render-note {
        font-size: 0.75rem;
        color: #6e7681;
        font-style: italic;
      }

      /* ============ v4.11.0 — node-list panel (button-driven UI) ============ */
      .fc-nodelist {
        border-top: 1px solid var(--fc-border);
        padding: 16px 20px;
        background: #fff;
        max-height: 40vh;
        overflow-y: auto;
      }
      .fc-section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #57606a;
        margin: 12px 0 8px;
        font-weight: 600;
      }
      .fc-section-title:first-child {
        margin-top: 0;
      }
      .fc-add-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .fc-ul {
        list-style: none;
        padding: 0;
        margin: 0 0 12px;
      }
      .fc-ul li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--fc-border);
      }
      .fc-ul li .fc-node-id {
        font-family: monospace;
        color: #57606a;
        min-width: 80px;
      }
      .fc-ul li input {
        flex: 1;
        padding: 4px 6px;
        border: 1px solid var(--fc-border);
        border-radius: 4px;
      }
      .fc-ul li select {
        padding: 4px;
        border: 1px solid var(--fc-border);
        border-radius: 4px;
      }
      .fc-ul li button {
        padding: 4px 10px;
        border: 1px solid var(--fc-border);
        background: #f6f8fa;
        color: #1f2328;
        border-radius: 4px;
        cursor: pointer;
      }
      .fc-ul li button.fc-delete {
        background: #cf222e;
        color: #fff;
        border-color: #cf222e;
      }
      .fc-connect-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
        flex-wrap: wrap;
      }
      .fc-connect-row select {
        padding: 4px;
        border: 1px solid var(--fc-border);
        border-radius: 4px;
        min-width: 100px;
      }
      /* v4.12.0 — small helper text under section titles */
      .fc-help {
        font-size: 11px;
        color: #57606a;
        margin: 0 0 8px;
      }
      /* v4.12.0 — per-node fill color picker sits next to the kind <select>
       * and label <input>. Native <input type="color"> gives a platform-native
       * color dialog so the user can pick any color, including custom. */
      .fc-ul li input[type='color'] {
        flex: 0 0 auto;
        padding: 0;
        width: 32px;
        height: 24px;
        border: 1px solid var(--fc-border);
        border-radius: 4px;
        cursor: pointer;
        background: #fff;
      }
      .fc-toolbar-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="fc-header">
      <h1>Flowchart Generator</h1>
      <span class="fc-hint"
        >Use the panel below the canvas to add nodes and edges &middot; Click Insert at Cursor to
        send to editor</span
      >
    </div>

    <div class="fc-split">
      <div class="fc-left">
        <div class="fc-canvas-host" id="canvas-host"></div>
        <!--
          v4.11.0 — button-driven UI. Every mutation (add/delete node,
          add/delete edge, change label, change kind) goes through the
          controls in this panel. The canvas is purely visual now.

          v4.12.0 — Reorganised the panel so the Connect form is the
          second section (right after Add Node) — user feedback said
          the old layout buried it below the node/edge lists and they
          couldn't find it. Also added a per-node color picker and a
          Save to File button alongside Insert at Cursor.
        -->
        <div id="fc-nodelist" class="fc-nodelist">
          <h3 class="fc-section-title">Add Node</h3>
          <div class="fc-add-row">
            <button class="fc-btn" data-add="process">+ Process</button>
            <button class="fc-btn" data-add="decision">+ Decision</button>
            <button class="fc-btn" data-add="terminator">+ Terminator</button>
            <button class="fc-btn" data-add="subroutine">+ Subroutine</button>
            <button class="fc-btn" data-add="document">+ Document</button>
          </div>

          <h3 class="fc-section-title">Add Connection</h3>
          <p class="fc-help">Pick two nodes and click "+ Edge" to connect them.</p>
          <div class="fc-connect-row">
            <label for="fc-connect-from">From:</label>
            <select id="fc-connect-from"></select>
            <label for="fc-connect-to">To:</label>
            <select id="fc-connect-to"></select>
            <button class="fc-btn" id="fc-connect-btn">+ Edge</button>
            <button class="fc-btn" id="fc-connect-cancel">Refresh</button>
          </div>

          <h3 class="fc-section-title">Nodes <span id="fc-node-count">0</span></h3>
          <ul id="fc-nodelist-ul" class="fc-ul"></ul>

          <h3 class="fc-section-title">Edges <span id="fc-edge-count">0</span></h3>
          <ul id="fc-edgelist-ul" class="fc-ul"></ul>

          <h3 class="fc-section-title">Export</h3>
          <div class="fc-toolbar-row">
            <button
              class="fc-btn primary"
              id="fc-btn-insert"
              title="Insert Mermaid block at cursor in main editor"
            >
              Insert at Cursor
            </button>
            <button
              class="fc-btn"
              id="fc-btn-save"
              title="Save Mermaid source to a .mmd / .md / .txt file"
            >
              Save to File
            </button>
            <button class="fc-btn" id="fc-btn-reset" title="Clear all nodes and edges">
              Reset All
            </button>
          </div>
          <span id="fc-status" aria-live="polite"></span>
        </div>
      </div>
      <div class="fc-preview-host" id="preview-host">
        <pre class="fc-preview-source" id="preview-source"></pre>
        <div class="fc-preview-render" id="preview-render"></div>
      </div>
    </div>

    <!--
      v4.9.8 — bundle everything into one script. The four pure modules
      (shapes / mermaid / store / canvas) plus the controller bootstrap
      live in src/renderer/flowchart-bundle.js. No cross-file script-tag
      ordering, no UMD wrappers, no `require()` — the bundle sets the
      four window globals before the controller's bootstrap() runs.

      v4.11.0 — the bundle's controller bootstrap wires up the
      #fc-nodelist panel. The legacy #fc-selection-toolbar floating
      toolbar is gone.

      v4.12.0 — the bundle also wires the new #fc-btn-save button and
      the per-node color picker inside the node list.
    -->
    <script src="renderer/flowchart-bundle.js"></script>
  </body>
</html>
